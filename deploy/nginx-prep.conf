# nginx in front of the prep dashboard.
#
# Flask's built-in server is a development server: single-threaded, no request
# limits, and it says so in its own startup banner. Anything reachable beyond
# localhost belongs behind a real one. This terminates TLS and proxies to
# gunicorn on the loopback.
#
# Substitute PREP_HOST for the name on your certificate.
#
#   sudo cp deploy/nginx-prep.conf /etc/nginx/sites-available/prep
#   sudo sed -i "s/PREP_HOST/your.host.name/g" /etc/nginx/sites-available/prep
#   sudo ln -s /etc/nginx/sites-available/prep /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# The dashboard's only authentication is a bearer token. Rate limiting is what
# stops that token being guessed at machine speed - without it, a long token is
# still only as good as the attacker's patience.
limit_req_zone $binary_remote_addr zone=prep_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=prep_general:10m rate=120r/m;
# 429 rather than nginx's default 503: "you are going too fast" is true,
# "the service is unavailable" is not, and the difference matters when you
# are the one reading the log trying to work out what broke.
limit_req_status 429;

# Like "combined", but $uri (path only) instead of $request (path and query),
# so a ?token=... never reaches the log. No referer either: the page sends
# none, and anything that did arrive in one is not worth keeping.
log_format prep_noquery '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    # Uncomment if this machine has IPv6. nginx refuses to START on a machine
    # without it, so it is off by default - a dashboard that does not come up
    # is a worse failure than one reachable only over IPv4.
    # listen [::]:80;
    server_name PREP_HOST;

    # Everything over TLS. A token in a query string on plain HTTP is a token
    # read by anyone on the path.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    # listen [::]:443 ssl;      # uncomment if this machine has IPv6
    server_name PREP_HOST;

    # No HTTP/2 on purpose. It gains nothing for one person loading one small
    # page, and the directive to enable it changed in nginx 1.25: "http2 on;"
    # is a hard error on 1.24 and earlier, which is what Ubuntu 24.04 and Debian
    # currently ship. Not worth a config that fails to start.

    ssl_certificate     /etc/ssl/prep/fullchain.pem;
    ssl_certificate_key /etc/ssl/prep/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:prep_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # This page is for one person on one device. None of it should be cached
    # by anything in between, and it has no business in a frame.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    # The dashboard is small. A large body is either a mistake or an attack.
    client_max_body_size 256k;

    # The token often arrives in the query string, and nginx writes query
    # strings to the access log by default ("combined" logs $request, which
    # includes it). That would put it in a file, and in your log shipper, in
    # plain text - so this log records the path without the query.
    access_log /var/log/nginx/prep.access.log prep_noquery;

    location / {
        limit_req zone=prep_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Anything that changes state, held to a stricter rate. /task and
    # /reschedule book into iCloud and fetch the timetable feed before they
    # answer, so they get the same generous read timeout as the page.
    location ~ ^/(override|blackout|log|reschedule|task) {
        limit_req zone=prep_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/healthz;
    }
}
