# nginx in front of the prep dashboard, for a Cloudflare Tunnel.
#
# With a tunnel, Cloudflare terminates TLS at its edge and cloudflared carries
# the request down an outbound connection to this machine. So nginx listens on
# the loopback only, in plain HTTP: nothing on the network can reach it, and
# no port is opened on your router. It is still here for what it did before -
# rate limits, the headers, and a log the token never reaches.
#
# install.sh --cert cloudflare installs this as /etc/nginx/sites-available/prep.
# By hand, substitute TUNNEL_PORT (default 8088) and the gunicorn port:
#
#   sed -e "s/TUNNEL_PORT/8088/g" deploy/nginx-prep-tunnel.conf \
#     | sudo tee /etc/nginx/sites-available/prep >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/prep /etc/nginx/sites-enabled/prep
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then point the tunnel's public hostname at http://localhost:TUNNEL_PORT.

# Every request arrives from cloudflared on 127.0.0.1, so rate limiting by
# $remote_addr would put everyone in one bucket. Cloudflare sends the real
# client address in CF-Connecting-IP; trust it only from the loopback, where
# cloudflared is the only thing that can be connecting.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# The dashboard's only authentication is a bearer token. Rate limiting is what
# stops that token being guessed at machine speed - without it, a long token is
# still only as good as the attacker's patience.
limit_req_zone $binary_remote_addr zone=prep_login:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=prep_general:10m rate=120r/m;
limit_req_status 429;

# Like "combined", but $uri (path only) instead of $request (path and query),
# so a ?token=... never reaches the log.
log_format prep_noquery '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_user_agent"';

server {
    listen 127.0.0.1:TUNNEL_PORT;
    server_name _;

    # The browser only ever sees Cloudflare's HTTPS, so these still apply.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;

    client_max_body_size 256k;

    access_log /var/log/nginx/prep.access.log prep_noquery;

    location / {
        limit_req zone=prep_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ~ ^/(override|blackout|log|reschedule|task) {
        limit_req zone=prep_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:8080/healthz;
    }
}
